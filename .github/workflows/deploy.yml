
name: Deploy Sunshine Landscape Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Amazon S3
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy website files to S3
        run: |
          EXCLUDES=(
            --exclude ".git/*"
            --exclude ".github/*"
            --exclude "infra/contact-api/*"
            --exclude "infra/contact-api/**"
            --exclude "**/node_modules/*"
            --exclude "**/.aws-sam/*"
          )

          # Assets first: long browser/CDN cache (1 year) for repeat visits
          aws s3 sync . s3://sunshine-landscape-mgmt \
            "${EXCLUDES[@]}" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000"

          # HTML: short TTL so page edits show quickly without a full CDN wait
          aws s3 sync . s3://sunshine-landscape-mgmt \
            "${EXCLUDES[@]}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=300, must-revalidate" \
            --content-type "text/html; charset=utf-8"

          # Remove orphaned remote files (no Cache-Control change)
          aws s3 sync . s3://sunshine-landscape-mgmt \
            --delete \
            "${EXCLUDES[@]}" \
            --size-only
