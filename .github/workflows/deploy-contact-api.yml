name: Deploy Contact API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/contact-api/**"
      - ".github/workflows/deploy-contact-api.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Resend + DynamoDB API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/contact-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          ls -la
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json; falling back to npm install"
            npm install
          fi

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build
        run: sam build

      - name: Prepare SAM artifact bucket
        run: |
          BUCKET="sunshine-sam-artifacts-203475186152"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
          fi
          echo "SAM_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "Missing GitHub secret RESEND_API_KEY. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Do not override ContactFromEmail here — shell quoting truncates it.
          # Template default is: Sunshine Landscape <noreply@sunshine-landscape.com>
          sam deploy \
            --stack-name sunshine-contact-api \
            --capabilities CAPABILITY_IAM \
            --s3-bucket "$SAM_BUCKET" \
            --s3-prefix sunshine-contact-api \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ResendApiKey=${RESEND_API_KEY}" \
              "ContactToEmail=slandscapemgmt@gmail.com"

      - name: Print API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name sunshine-contact-api \
            --query "Stacks[0].Outputs[?OutputKey=='ContactApiUrl'].OutputValue" \
            --output text
